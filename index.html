<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spike · Sistema de Fidelización</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --primary: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem 1rem;
    }
    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #60a5fa;
      background: rgba(37, 99, 235, 0.12);
      border: 1px solid rgba(37, 99, 235, 0.3);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }
    p.sub {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .portal-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }
    .btn-portal {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 1.1rem 1.2rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .btn-portal:hover {
      background: rgba(37, 99, 235, 0.1);
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .btn-title {
      font-weight: 700;
      font-size: 1rem;
      color: #ffffff;
    }
    .btn-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
      text-align: left;
    }
    .footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #475569;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="badge">KIBO PLATFORM</div>
  <h1>Spike</h1>
  <p class="sub">Plataforma de Fidelización y Recompensas</p>

  <div class="portal-box">
    <a href="/spike/admin/" class="btn-portal">
      <div class="btn-title">Terminal de Caja y Gestión</div>
      <div class="btn-desc">Acceso para registro de consumos, canjes y reglas de negocio.</div>
    </a>

    <a href="/spike/macchia/?cli=CLI-43707392" class="btn-portal">
      <div class="btn-title">Tarjeta Digital de Cliente</div>
      <div class="btn-desc">Vista para el cliente en smartphone (Macchia Café).</div>
    </a>
  </div>

  <div class="footer">
    Spike Loyalty Engine · Powered by KIBO
  </div>
</div>

</body>
</html>
