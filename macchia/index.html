<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Macchia Parfums · Tarjeta Digital</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#020812">

  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1WzFb7rEBFlYu3sQGGo2o_yRq5u8lcNbG">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1WzFb7rEBFlYu3sQGGo2o_yRq5u8lcNbG">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #020812; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>

  <iframe id="app-frame" src="" allow="clipboard-write"></iframe>

  <script>
    // URL activa de Apps Script (kibopwrd)
    const APPS_SCRIPT_EXEC_URL = "https://script.google.com/macros/s/AKfycbwcc5kZ2nAa75ujiq9-uhSEOW4GXLCRR4lUXEtp1beVfrRyYzeJHmNHHb8BMcLHSLfr/exec";

    // Si entra directo sin cliente, fuerza ?demo=1 para mostrar la tarjeta estándar
    let params = window.location.search;
    if (!params || params === "" || params === "?") {
      params = "?demo=1";
    }

    document.getElementById('app-frame').src = APPS_SCRIPT_EXEC_URL + params;
  </script>

</body>
</html>
