<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Macchia Parfums · Tarjeta de Fidelización</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-header: #020812;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --gold: #d97706;
      --gold-dark: #b45309;
      --border-soft: rgba(15, 23, 42, 0.08);
      --radius: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }

    body {
      background: #020617;
      min-height: 100vh;
      padding: 1.4rem 1rem 2rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      color: var(--text-dark);
    }

    .card-container {
      width: 100%;
      max-width: 420px;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      background-color: #f1f5f9;
      background-image: url('https://lh3.googleusercontent.com/d/13Dsw1PEAiziJm8-DB_F5zR4TjmIVaGKo');
      background-repeat: repeat;
      background-size: 150px auto;
    }

    .card-header {
      background-color: var(--brand-header);
      padding: 1.5rem 1.2rem;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .logo-img {
      max-height: 48px;
      width: auto;
      object-fit: contain;
    }

    .card-body-veil {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      padding: 1.4rem 1.2rem 1.6rem;
    }

    .client-section {
      text-align: center;
      margin-bottom: 1.3rem;
    }
    .client-tag {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--brand-header);
      margin-bottom: 0.25rem;
    }
    .client-name {
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--brand-header);
      letter-spacing: -0.02em;
    }

    .stamps-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.65rem;
      margin-bottom: 1.2rem;
    }

    .stamp-slot {
      aspect-ratio: 1;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.95);
      border: 1.5px dashed #94a3b8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      transition: all 0.2s ease;
    }

    .stamp-slot.active {
      border: 1.5px solid var(--gold);
      background: radial-gradient(circle, #fffbeb 0%, #fef3c7 100%);
      box-shadow: 0 4px 10px rgba(217, 119, 6, 0.28);
    }

    .stamp-num {
      font-size: 0.82rem;
      font-weight: 800;
      color: #64748b;
    }

    .stamp-icon {
      width: 65%;
      height: 65%;
      object-fit: contain;
    }

    .stamp-slot.sponsor-goal {
      border: 1.5px solid #f59e0b;
      background: rgba(255, 255, 255, 0.98);
    }
    .stamp-slot.sponsor-goal.active {
      border: 2px solid #d97706;
      background: radial-gradient(circle, #fef3c7 0%, #fde68a 100%);
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.35);
    }
    .badge-meta {
      position: absolute;
      top: -7px;
      font-size: 0.52rem;
      background: var(--brand-header);
      color: #ffffff;
      font-weight: 800;
      padding: 0.12rem 0.38rem;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    .reward-box {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 0.95rem 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }
    .reward-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .reward-count {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-top: 0.15rem;
    }
    .reward-val {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--gold-dark);
    }

    .sponsor-ad-container {
      margin-top: 1.1rem;
      position: relative;
    }
    .sponsor-ad-badge {
      position: absolute;
      top: -8px;
      left: 12px;
      background: var(--brand-header);
      color: #ffffff;
      font-size: 0.6rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.18rem 0.55rem;
      border-radius: 12px;
      z-index: 2;
    }
    .sponsor-ad-frame {
      display: block;
      width: 100%;
      aspect-ratio: 400 / 120;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(15, 23, 42, 0.15);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
      background: #ffffff;
      text-decoration: none;
    }
    .sponsor-ad-frame.clickable {
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .sponsor-ad-frame.clickable:active {
      transform: scale(0.99);
    }
    .sponsor-ad-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-footer {
      text-align: center;
      font-size: 0.72rem;
      color: #334155;
      margin-top: 1.3rem;
      border-top: 1px solid rgba(15, 23, 42, 0.12);
      padding-top: 0.9rem;
      line-height: 1.5;
      font-weight: 500;
    }
    .card-footer-kibo {
      font-size: 0.65rem;
      color: #64748b;
      margin-top: 0.45rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

<div class="card-container">
  
  <div class="card-header">
    <img id="card-logo" src="https://lh3.googleusercontent.com/d/1IOQYQ91fVdU1fmG4AIdDQDoZF2YGQZJH" alt="Macchia Parfums" class="logo-img">
  </div>

  <div class="card-body-veil">
    
    <div class="client-section">
      <div class="client-tag" id="card-badge-status">Programa de Fidelización</div>
      <div class="client-name" id="card-client-name">Cliente Macchia</div>
    </div>

    <div class="stamps-grid" id="stamps-grid"></div>

    <div class="reward-box">
      <div>
        <div class="reward-label">Sellos Acumulados</div>
        <div class="reward-count" id="lbl-sellos-count">2 / 5</div>
      </div>
      <div style="text-align:right;">
        <div class="reward-label">Beneficio Disponible</div>
        <div class="reward-val" id="lbl-premio">30.00 BOB</div>
      </div>
    </div>

    <div class="sponsor-ad-container" id="sponsor-ad-block" style="display: none;">
      <span class="sponsor-ad-badge" id="sponsor-ad-label">Espacio Comercial</span>
      <div id="sponsor-wrapper"></div>
    </div>

    <div class="card-footer" id="card-footer-rules">
      Ganas 1 sello por compras desde 15 BOB · Ciclo de 5 sellos<br>
      Canje de beneficio aplicable en consumos desde 20 BOB
      <div class="card-footer-kibo">POWERED BY KIBO</div>
    </div>

  </div>

</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyXhjvfBEJC7XHMJi1jpkAXiAf-XYEW350sar7O29Zpl6LMF3HzAiLeaMCZHQNfWuBP6Q/exec";
  const DEFAULT_STAMP = 'https://lh3.googleusercontent.com/d/1WzFb7rEBFlYu3sQGGo2o_yRq5u8lcNbG';
  const BANNER_DEFAULT = "https://lh3.googleusercontent.com/d/1cFK4pyi_fI9oPwUEQlkoKxgO5E9Mf9-m";
  const STAMP_DEFAULT = "https://lh3.googleusercontent.com/d/1b0fhTaF3uq_54zkmKALhYVsZymAWw2Gn";

  let currentConfig = {
    COMPRAS_PARA_CICLO: 5,
    MONTO_MINIMO_SELLO: 15,
    MONTO_MINIMO_CANJE: 20,
    SPONSOR_ACTIVO: 'SI',
    SPONSOR_MODALIDAD: 'BANNER_Y_SELLO',
    SPONSOR_NOMBRE: 'Coca-Cola',
    SPONSOR_LOGO_URL: BANNER_DEFAULT,
    SPONSOR_STAMP_ICON: STAMP_DEFAULT,
    SPONSOR_LINK: ''
  };

  // Plantilla estándar de demostración (2 sellos de prueba para verificar diseño y sponsor)
  let currentCliente = {
    nombre: 'Cliente Macchia',
    sellosActuales: 2,
    premioCalculado: 30.00,
    metaSellos: 5
  };

  async function iniciarTarjeta() {
    const params = new URLSearchParams(window.location.search);
    const tel = params.get('tel');
    const esModoDemo = params.get('demo') === '1' || !tel;

    if (esModoDemo) {
      document.getElementById('card-badge-status').innerText = 'Vista Previa Estándar';
      document.getElementById('card-client-name').innerText = 'Cliente Macchia';
    }

    // 1. Render inmediato con valores estándar
    renderizarTarjeta(currentCliente, currentConfig);
    renderizarCondiciones(currentConfig);

    // 2. Traer configuración real de Sheets
    try {
      const cfgRes = await fetch(`${SCRIPT_URL}?action=getConfig`).then(r => r.json());
      if (cfgRes && cfgRes.success && cfgRes.config) {
        currentConfig = Object.assign({}, currentConfig, cfgRes.config);
        currentCliente.metaSellos = Number(currentConfig.COMPRAS_PARA_CICLO) || 5;
        renderizarCondiciones(currentConfig);
        renderizarTarjeta(currentCliente, currentConfig);
      }
    } catch(e) {
      console.warn("Carga de configuración:", e);
    }

    // 3. Si viene un teléfono real, consultar datos reales del cliente
    if (!esModoDemo && tel) {
      try {
        const cliRes = await fetch(`${SCRIPT_URL}?action=getCliente&telefono=${encodeURIComponent(tel)}`).then(r => r.json());
        if (cliRes && cliRes.success && cliRes.cliente) {
          currentCliente = cliRes.cliente;
          document.getElementById('card-badge-status').innerText = 'Programa de Fidelización';
          renderizarTarjeta(currentCliente, currentConfig);
        }
      } catch(e) {
        console.warn("Carga de cliente real:", e);
      }
    }
  }

  function renderizarCondiciones(cfg) {
    const minSello = cfg.MONTO_MINIMO_SELLO || 15;
    const minCanje = cfg.MONTO_MINIMO_CANJE || 20;
    const meta = Number(cfg.COMPRAS_PARA_CICLO) || 5;

    const footer = document.getElementById('card-footer-rules');
    if (footer) {
      footer.innerHTML = `
        Ganas 1 sello por compras desde ${minSello} BOB · Ciclo de ${meta} sellos<br>
        Canje de beneficio aplicable en consumos desde ${minCanje} BOB
        <div class="card-footer-kibo">POWERED BY KIBO</div>
      `;
    }
  }

  function renderizarTarjeta(cli, cfg) {
    const nameEl = document.getElementById('card-client-name');
    if (nameEl) nameEl.innerText = cli.nombre || 'Cliente';

    const meta = Number(cfg.COMPRAS_PARA_CICLO) || cli.metaSellos || 5;
    const countEl = document.getElementById('lbl-sellos-count');
    if (countEl) countEl.innerText = `${cli.sellosActuales || 0} / ${meta}`;

    const premioEl = document.getElementById('lbl-premio');
    if (premioEl) premioEl.innerText = `${Number(cli.premioCalculado || 0).toFixed(2)} BOB`;

    const grid = document.getElementById('stamps-grid');
    if (!grid) return;
    grid.innerHTML = '';

    const sponsorActivo = (String(cfg.SPONSOR_ACTIVO).toUpperCase() === 'SI');
    const esTier2 = (sponsorActivo && cfg.SPONSOR_MODALIDAD === 'BANNER_Y_SELLO');
    const stampIconUrl = cfg.STAMP_ICON || DEFAULT_STAMP;
    const sponsorStampUrl = cfg.SPONSOR_STAMP_ICON || STAMP_DEFAULT;

    for (let i = 1; i <= meta; i++) {
      const alcanzado = (i <= (cli.sellosActuales || 0));
      const esUltimo = (i === meta);
      const slot = document.createElement('div');
      slot.className = 'stamp-slot' + (alcanzado ? ' active' : '');

      if (esUltimo && esTier2) {
        slot.classList.add('sponsor-goal');
        const badge = document.createElement('div');
        badge.className = 'badge-meta';
        badge.innerText = 'META';
        slot.appendChild(badge);

        const img = document.createElement('img');
        img.className = 'stamp-icon';
        img.src = sponsorStampUrl;
        img.style.opacity = alcanzado ? '1' : '0.35';
        slot.appendChild(img);
      } else {
        if (alcanzado) {
          const img = document.createElement('img');
          img.className = 'stamp-icon';
          img.src = stampIconUrl;
          slot.appendChild(img);
        } else {
          const num = document.createElement('span');
          num.className = 'stamp-num';
          num.innerText = i;
          slot.appendChild(num);
        }
      }

      grid.appendChild(slot);
    }

    const bannerBlock = document.getElementById('sponsor-ad-block');
    const bannerWrapper = document.getElementById('sponsor-wrapper');
    const bannerLabel = document.getElementById('sponsor-ad-label');

    const imagenUrl = cfg.SPONSOR_LOGO_URL || BANNER_DEFAULT;
    const linkUrl = (cfg.SPONSOR_LINK || '').trim();

    if (sponsorActivo && imagenUrl && bannerBlock && bannerWrapper) {
      bannerBlock.style.display = 'block';
      if (bannerLabel) bannerLabel.innerText = cfg.SPONSOR_NOMBRE ? `Aliado: ${cfg.SPONSOR_NOMBRE}` : 'Espacio Comercial';

      if (linkUrl) {
        bannerWrapper.innerHTML = `
          <a href="${linkUrl}" target="_blank" class="sponsor-ad-frame clickable">
            <img src="${imagenUrl}" alt="Sponsor" class="sponsor-ad-img">
          </a>
        `;
      } else {
        bannerWrapper.innerHTML = `
          <div class="sponsor-ad-frame">
            <img src="${imagenUrl}" alt="Sponsor" class="sponsor-ad-img">
          </div>
        `;
      }
    } else if (bannerBlock) {
      bannerBlock.style.display = 'none';
    }
  }

  window.addEventListener('DOMContentLoaded', iniciarTarjeta);
</script>

</body>
</html>
