<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Macchia Parfums · Tarjeta de Fidelización</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-header: #020812;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --gold: #d97706;
      --gold-dark: #b45309;
      --border-soft: rgba(15, 23, 42, 0.08);
      --radius: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }

    body {
      background: #f1f5f9;
      min-height: 100vh;
      padding: 1.4rem 1rem 2rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      color: var(--text-dark);
    }

    /* TARJETA PRINCIPAL */
    .card-container {
      width: 100%;
      max-width: 420px;
      border-radius: var(--radius);
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 15px 40px rgba(2, 8, 18, 0.12), 0 1px 3px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(15, 23, 42, 0.06);
    }

    /* CABECERA INSTITUCIONAL MACCHIA */
    .card-header {
      background-color: var(--brand-header);
      padding: 1.5rem 1.2rem;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .logo-img {
      max-height: 48px;
      width: auto;
      object-fit: contain;
    }

    /* CUERPO CON TRAMA Y CAPA BLANCA DE CONTRASTE */
    .card-body-wrapper {
      position: relative;
      background-color: #f8fafc;
      background-image: url('https://lh3.googleusercontent.com/d/13Dsw1PEAiziJm8-DB_F5zR4TjmIVaGKo');
      background-repeat: repeat;
      background-size: 160px auto;
    }
    .card-body-veil {
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      padding: 1.4rem 1.2rem 1.6rem;
    }

    /* DATOS DEL CLIENTE */
    .client-section {
      text-align: center;
      margin-bottom: 1.3rem;
    }
    .client-tag {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold-dark);
      margin-bottom: 0.25rem;
    }
    .client-name {
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--brand-header);
      letter-spacing: -0.02em;
    }

    /* GRILLA DINÁMICA DE SELLOS */
    .stamps-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.65rem;
      margin-bottom: 1.2rem;
    }

    .stamp-slot {
      aspect-ratio: 1;
      border-radius: 12px;
      background: #ffffff;
      border: 1.5px dashed #cbd5e1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
      transition: all 0.2s ease;
    }

    .stamp-slot.active {
      border: 1.5px solid var(--gold);
      background: radial-gradient(circle, #fffbeb 0%, #fef3c7 100%);
      box-shadow: 0 4px 10px rgba(217, 119, 6, 0.22);
    }

    .stamp-num {
      font-size: 0.82rem;
      font-weight: 800;
      color: #94a3b8;
    }

    .stamp-icon {
      width: 65%;
      height: 65%;
      object-fit: contain;
    }

    /* SELLO FINAL: SPONSOR / META */
    .stamp-slot.sponsor-goal {
      border: 1.5px solid #f59e0b;
      background: #fffdf5;
    }
    .stamp-slot.sponsor-goal.active {
      border: 2px solid #d97706;
      background: radial-gradient(circle, #fef3c7 0%, #fde68a 100%);
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.35);
    }
    .badge-meta {
      position: absolute;
      top: -7px;
      font-size: 0.52rem;
      background: var(--gold-dark);
      color: #ffffff;
      font-weight: 800;
      padding: 0.12rem 0.38rem;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    /* CAJA DE BENEFICIOS */
    .reward-box {
      background: #ffffff;
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 0.95rem 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .reward-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .reward-count {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-top: 0.15rem;
    }
    .reward-val {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--gold-dark);
    }

    /* BANNER PUBLICITARIO GRÁFICO (400x120) */
    .sponsor-ad-container {
      margin-top: 1.1rem;
      position: relative;
    }
    .sponsor-ad-badge {
      position: absolute;
      top: -8px;
      left: 12px;
      background: var(--brand-header);
      color: #ffffff;
      font-size: 0.6rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.18rem 0.55rem;
      border-radius: 12px;
      z-index: 2;
    }
    .sponsor-ad-link {
      display: block;
      width: 100%;
      aspect-ratio: 400 / 120;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(15, 23, 42, 0.12);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      background: #ffffff;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
    }
    .sponsor-ad-link:active {
      transform: scale(0.99);
    }
    .sponsor-ad-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* LEGALES */
    .card-footer {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 1.3rem;
      border-top: 1px solid var(--border-soft);
      padding-top: 0.9rem;
      line-height: 1.45;
    }
    .card-footer-kibo {
      font-size: 0.62rem;
      color: #94a3b8;
      margin-top: 0.25rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

<div class="card-container">
  
  <!-- CABECERA -->
  <div class="card-header">
    <img id="card-logo" src="https://lh3.googleusercontent.com/d/1IOQYQ91fVdU1fmG4AIdDQDoZF2YGQZJH" alt="Macchia Parfums" class="logo-img">
  </div>

  <!-- CUERPO CLARO CON TRAMA -->
  <div class="card-body-wrapper">
    <div class="card-body-veil">
      
      <div class="client-section">
        <div class="client-tag">Programa de Fidelización</div>
        <div class="client-name" id="card-client-name">Alfonso</div>
      </div>

      <!-- GRILLA DINÁMICA DE SELLOS -->
      <div class="stamps-grid" id="stamps-grid"></div>

      <!-- CAJA DE BENEFICIO -->
      <div class="reward-box">
        <div>
          <div class="reward-label">Sellos Acumulados</div>
          <div class="reward-count" id="lbl-sellos-count">4 / 10</div>
        </div>
        <div style="text-align:right;">
          <div class="reward-label">Beneficio Disponible</div>
          <div class="reward-val" id="lbl-premio">136.40 BOB</div>
        </div>
      </div>

      <!-- BANNER ANUNCIANTE 400x120 -->
      <div class="sponsor-ad-container" id="sponsor-ad-block" style="display: none;">
        <span class="sponsor-ad-badge" id="sponsor-ad-label">Espacio Comercial</span>
        <a href="#" target="_blank" class="sponsor-ad-link" id="sponsor-ad-link">
          <img id="sponsor-ad-img" src="" alt="Publicidad" class="sponsor-ad-img">
        </a>
      </div>

      <!-- LEGALES -->
      <div class="card-footer">
        Válido en Boutique Macchia Parfums · Recompensa acumulativa<br>
        <div class="card-footer-kibo">POWERED BY KIBO · SPIKE</div>
      </div>

    </div>
  </div>

</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyXhjvfBEJC7XHMJi1jpkAXiAf-XYEW350sar7O29Zpl6LMF3HzAiLeaMCZHQNfWuBP6Q/exec";
  const DEFAULT_STAMP = 'https://lh3.googleusercontent.com/d/1WzFb7rEBFlYu3sQGGo2o_yRq5u8lcNbG';

  // URLs oficiales directas de tus materiales de Drive
  const BANNER_SPONSOR_URL = "https://lh3.googleusercontent.com/d/1cFK4pyi_fI9oPwUEQlkoKxgO5E9Mf9-m";
  const STAMP_SPONSOR_URL = "https://lh3.googleusercontent.com/d/1b0fhTaF3uq_54zkmKALhYVsZymAWw2Gn";

  async function iniciarTarjeta() {
    const params = new URLSearchParams(window.location.search);
    const tel = params.get('tel') || '77290636';

    let cliente = {
      nombre: 'Alfonso',
      sellosActuales: 4,
      premioCalculado: 136.4,
      metaSellos: 10
    };

    let config = {
      COMPRAS_PARA_CICLO: 10,
      SPONSOR_ACTIVO: 'SI',
      SPONSOR_MODALIDAD: 'BANNER_Y_SELLO',
      SPONSOR_NOMBRE: 'Coca-Cola',
      SPONSOR_LOGO_URL: BANNER_SPONSOR_URL,
      SPONSOR_STAMP_ICON: STAMP_SPONSOR_URL,
      SPONSOR_LINK: 'https://kibo-pwrd.github.io/spike/macchia/'
    };

    // Renderizado inmediato
    renderizarTarjeta(cliente, config);

    // Consulta de datos en vivo desde Macchia - DB
    try {
      const [cfgRes, cliRes] = await Promise.all([
        fetch(`${SCRIPT_URL}?action=getConfig`).then(r => r.json()).catch(() => null),
        fetch(`${SCRIPT_URL}?action=getCliente&telefono=${encodeURIComponent(tel)}`).then(r => r.json()).catch(() => null)
      ]);

      if (cfgRes && cfgRes.success && cfgRes.config) {
        config = Object.assign({}, config, cfgRes.config);
        // Garantizar uso de imagen si viene vacío
        if (!config.SPONSOR_LOGO_URL) config.SPONSOR_LOGO_URL = BANNER_SPONSOR_URL;
        if (!config.SPONSOR_STAMP_ICON) config.SPONSOR_STAMP_ICON = STAMP_SPONSOR_URL;
      }
      if (cliRes && cliRes.success && cliRes.cliente) {
        cliente = cliRes.cliente;
      }

      renderizarTarjeta(cliente, config);
    } catch(e) {
      console.warn("Modo local/reserva activo:", e);
    }
  }

  function renderizarTarjeta(cli, cfg) {
    document.getElementById('card-client-name').innerText = cli.nombre;
    const meta = Number(cfg.COMPRAS_PARA_CICLO) || cli.metaSellos || 10;
    document.getElementById('lbl-sellos-count').innerText = `${cli.sellosActuales} / ${meta}`;
    document.getElementById('lbl-premio').innerText = `${Number(cli.premioCalculado || 0).toFixed(2)} BOB`;

    // Grilla
    const grid = document.getElementById('stamps-grid');
    grid.innerHTML = '';

    const sponsorActivo = (String(cfg.SPONSOR_ACTIVO).toUpperCase() === 'SI');
    const esTier2 = (sponsorActivo && cfg.SPONSOR_MODALIDAD === 'BANNER_Y_SELLO');
    const stampIconUrl = cfg.STAMP_ICON || DEFAULT_STAMP;
    const sponsorStampUrl = cfg.SPONSOR_STAMP_ICON || STAMP_SPONSOR_URL;

    for (let i = 1; i <= meta; i++) {
      const alcanzado = (i <= cli.sellosActuales);
      const esUltimo = (i === meta);
      const slot = document.createElement('div');
      slot.className = 'stamp-slot' + (alcanzado ? ' active' : '');

      if (esUltimo && esTier2) {
        slot.classList.add('sponsor-goal');
        const badge = document.createElement('div');
        badge.className = 'badge-meta';
        badge.innerText = 'META';
        slot.appendChild(badge);

        const img = document.createElement('img');
        img.className = 'stamp-icon';
        img.src = sponsorStampUrl;
        img.style.opacity = alcanzado ? '1' : '0.35';
        slot.appendChild(img);
      } else {
        if (alcanzado) {
          const img = document.createElement('img');
          img.className = 'stamp-icon';
          img.src = stampIconUrl;
          slot.appendChild(img);
        } else {
          const num = document.createElement('span');
          num.className = 'stamp-num';
          num.innerText = i;
          slot.appendChild(num);
        }
      }

      grid.appendChild(slot);
    }

    // Banner 400x120
    const bannerBlock = document.getElementById('sponsor-ad-block');
    const bannerImg = document.getElementById('sponsor-ad-img');
    const bannerLink = document.getElementById('sponsor-ad-link');
    const bannerLabel = document.getElementById('sponsor-ad-label');

    const imagenUrl = cfg.SPONSOR_LOGO_URL || BANNER_SPONSOR_URL;

    if (sponsorActivo && imagenUrl) {
      bannerBlock.style.display = 'block';
      bannerImg.src = imagenUrl;
      bannerLabel.innerText = cfg.SPONSOR_NOMBRE ? `Aliado: ${cfg.SPONSOR_NOMBRE}` : 'Espacio Comercial';
      if (cfg.SPONSOR_LINK) bannerLink.href = cfg.SPONSOR_LINK;
    } else {
      bannerBlock.style.display = 'none';
    }
  }

  window.addEventListener('DOMContentLoaded', iniciarTarjeta);
</script>

</body>
</html>
